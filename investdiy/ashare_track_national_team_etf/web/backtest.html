<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="bt.title">国家队收益与跟踪回测</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  .take { display: flex; flex-direction: column; gap: 4px; }
  .legend .sw, .sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
  .rules { margin: 0; padding-left: 18px; font-size: 13px; color: var(--fg-muted); line-height: 1.8; max-width: 92ch; display: flex; flex-direction: column; gap: 4px; }
  #sum-table th, #sum-table td, #range-table th, #range-table td, #year-table th, #year-table td { white-space: nowrap; }
  #sum-table th:first-child, #sum-table td:first-child,
  #range-table th:first-child, #range-table td:first-child,
  #year-table th:first-child, #year-table td:first-child,
  #ev-table th:first-child, #ev-table td:first-child { text-align: left; }
  #sum-table thead tr:first-child th, #year-table thead tr:first-child th { text-align: center; border-bottom: 0; }
  #sum-table .grp, #year-table .grp { border-left: 1px solid var(--line); }
  h3.sub { margin: 14px 0 0; font-size: 13px; font-weight: 600; color: var(--fg-muted); }
  .about { margin: 0; padding-left: 18px; font-size: 13px; color: var(--fg-muted); line-height: 1.85; max-width: 92ch; display: flex; flex-direction: column; gap: 6px; }
  .about b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<!-- text lives in backtest.strings.js; data is generated by backtest.py (data/bt_*.csv) -->
<header class="topbar">
  <div class="topbar-in">
    <a class="topbar-home" href="/" data-i18n="common.home">投研工具箱</a>
    <span class="topbar-sep">/</span>
    <a class="topbar-title" href="./" data-i18n="page.title">A股国家队宽基ETF数据跟踪</a>
    <span class="topbar-sep">/</span>
    <span class="topbar-title" data-i18n="bt.crumb">跟踪回测</span>
    <span class="topbar-right" id="asof"></span>
  </div>
  <nav class="secnav" data-i18n-aria-label="nav.label"><div class="secnav-in" id="secnav"></div></nav>
</header>

<main class="page">
  <div class="take">
    <h1 class="page-title" data-i18n="bt.title">国家队收益与跟踪回测</h1>
    <p class="stale" id="stale" hidden></p>
    <p class="lede" id="take-nt">加载中…</p>
    <p class="lede" id="take-mr"></p>
    <p class="lede" id="take-read"></p>
  </div>

  <section class="card" id="summary" data-nav="bt.nav.sum">
    <div class="card-head">
      <h2 data-i18n="bt.sum.h2">收益率对比</h2>
      <div class="card-tools"><span class="dl" data-files="bt_summary"></span></div>
    </div>
    <p class="note" data-i18n="bt.sum.note"></p>
    <ul class="rules">
      <li data-i18n="bt.rule.nt"></li>
      <li data-i18n="bt.rule.mr"></li>
    </ul>
    <div class="tablebox">
      <table class="table" id="sum-table"><thead></thead><tbody></tbody></table>
    </div>
    <p class="note" data-i18n="bt.sum.unit"></p>
    <h3 class="sub" data-i18n="bt.why.h3"></h3>
    <ul class="rules">
      <li data-i18n-html="bt.why.size"></li>
      <li data-i18n-html="bt.why.mix"></li>
      <li data-i18n-html="bt.why.miss"></li>
    </ul>
  </section>

  <section class="card" id="pnl" data-nav="bt.nav.pnl">
    <div class="card-head">
      <h2 data-i18n="bt.pnl.h2">累计盈亏与持仓</h2>
      <div class="card-tools"><div id="pnl-range"></div><span class="dl" data-files="bt_equity"></span></div>
    </div>
    <p class="note" data-i18n="bt.pnl.note"></p>
    <div class="tablebox">
      <table class="table" id="range-table"><thead></thead><tbody></tbody></table>
    </div>
    <p class="note" data-i18n="bt.r.unit"></p>
    <div class="legend" id="pnl-legend"></div>
    <h3 class="sub" data-i18n="bt.pnl.h3"></h3>
    <div class="chart loading" id="pnl-box" style="min-height: 260px"></div>
    <h3 class="sub" data-i18n="bt.hold.h3"></h3>
    <div class="chart loading" id="hold-box" style="min-height: 180px"></div>
  </section>

  <section class="card" id="yearly" data-nav="bt.nav.year">
    <h2 data-i18n="bt.year.h2">逐年拆解</h2>
    <p class="note" data-i18n="bt.year.note"></p>
    <div class="tablebox">
      <table class="table" id="year-table"><thead></thead><tbody></tbody></table>
    </div>
  </section>

  <section class="card" id="events" data-nav="bt.nav.ev">
    <div class="card-head">
      <h2 data-i18n="bt.ev.h2">信号之后的表现</h2>
      <div class="card-tools">
        <div class="seg" id="ev-period" role="group">
          <button type="button" data-period="all" aria-pressed="true" data-i18n="bt.ev.all"></button>
          <button type="button" data-period="recent" aria-pressed="false" data-i18n="bt.ev.recent"></button>
        </div>
        <span class="dl" data-files="bt_events"></span>
      </div>
    </div>
    <p class="note" data-i18n="bt.ev.note"></p>
    <div class="tablebox">
      <table class="table" id="ev-table"><thead></thead><tbody></tbody></table>
    </div>
  </section>

  <section class="card" id="about" data-nav="bt.nav.about">
    <h2 data-i18n="bt.a.h2">关于回测</h2>
    <ol class="about">
      <li data-i18n-html="bt.a.mwr"></li>
      <li data-i18n-html="bt.a.nt"></li>
      <li data-i18n-html="bt.a.mr"></li>
      <li data-i18n-html="bt.a.price"></li>
      <li data-i18n-html="bt.a.bias"></li>
      <li data-i18n-html="bt.a.read"></li>
    </ol>
  </section>
</main>

<script src="/static/vendor/d3.v7.9.0.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/site.js"></script>
<script src="/static/kit.js"></script>
<script src="strings.js"></script>
<script src="backtest.strings.js"></script>
<script src="backtest.js"></script>
</body>
</html>
