<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.title">公司业绩预测</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-site-disclaimer="profit-forecast">
<header class="topbar"><div class="topbar-in">
  <a class="topbar-home" href="/" data-i18n="common.home"></a>
  <span class="topbar-sep">/</span><span class="topbar-title" data-i18n="page.title"></span>
  <span id="ticker" class="topbar-right">601899.SH · 02899.HK</span>
</div></header>
<main class="page">
  <div class="intro"><p class="eyebrow" data-i18n="page.eyebrow"></p><h1 data-i18n="page.title"></h1><p class="lede" data-i18n="page.lede"></p></div>
  <div class="company-tabs" role="tablist" data-i18n-aria-label="company.tabs">
    <button id="company-zijin" type="button" role="tab" aria-selected="true" aria-controls="company-panel" data-i18n="company.zijin"></button>
    <button id="company-cmoc" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="company-panel" data-i18n="company.cmoc"></button>
    <button id="company-cnooc" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="company-panel" data-i18n="company.cnooc"></button>
    <button id="company-catl" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="catl-panel" data-i18n="company.catl"></button>
  </div>
  <div id="company-panel" role="tabpanel" aria-labelledby="company-zijin" tabindex="0">
  <section class="preset-grid" aria-label="Presets" data-i18n-aria-label="presets.title">
    <div class="card preset-card"><h2 data-i18n="presets.production"></h2><label for="production-preset"><span data-i18n="production.plan"></span><select id="production-preset"></select></label><button id="apply-production" type="button" data-i18n="production.apply"></button><p class="note" id="production-preview"></p><p class="note" data-i18n="production.note"></p></div>
    <div class="card preset-card"><h2 data-i18n="presets.price"></h2><label for="price-preset"><span data-i18n="prices.preset"></span><select id="price-preset"><option value="latest" data-i18n="prices.current"></option></select></label><button id="apply-price-preset" type="button" data-i18n="prices.apply"></button><div class="actions price-actions"><button id="bull" type="button" data-i18n="bull" data-i18n-aria-label="prices.increase"></button><button id="bear" type="button" data-i18n="bear" data-i18n-aria-label="prices.decrease"></button></div><p class="note" data-i18n="presets.price.note"></p></div>
    <div class="card preset-card"><h2 data-i18n="presets.history"></h2><label for="base"><span data-i18n="base"></span><select id="base"></select></label><button id="reset" type="button" data-i18n="reset"></button><p class="note" data-i18n="presets.history.note"></p></div>
  </section>
  <div class="snapshot-info"><p id="snapshot-status" class="note" role="status"></p><details id="snapshot-details"><summary data-i18n="prices.details"></summary><p class="note" data-i18n="prices.note"></p><div class="tablebox"><table class="table"><thead><tr><th data-i18n="audit.metal"></th><th data-i18n="prices.quote"></th><th data-i18n="prices.time"></th><th data-i18n="prices.converted"></th></tr></thead><tbody id="snapshot-rows"></tbody></table></div><p><a id="fx-source" target="_blank" rel="noopener noreferrer"></a></p></details></div>
  <p class="note" id="baseline-note"></p>
  <p class="note" id="cnooc-sources" hidden><a id="report-source" data-i18n="cnooc.reportSource" target="_blank" rel="noopener noreferrer"></a> <a id="cost-source" data-i18n="cnooc.costSource" target="_blank" rel="noopener noreferrer"></a> · <a id="guidance-source" data-i18n="cnooc.guidanceSource" target="_blank" rel="noopener noreferrer"></a></p>
  <p class="note" id="production-applied" role="status"></p>
  <form id="inputs" novalidate>
    <div class="workspace">
      <section class="card minerals"><div class="card-head"><h2 data-i18n="minerals"></h2><span class="note" data-i18n="live"></span></div><p class="note" data-i18n="price.note"></p><p id="fx-note" class="note"></p><div id="metal-inputs"></div></section>
      <aside class="result-panel">
        <p class="eyebrow" data-i18n="result.parent"></p><div class="hero-value"><output id="parent" aria-live="polite"></output><span data-i18n="unit.money"></span></div>
        <p id="error" role="alert" hidden></p><p id="band" class="result-note"></p>
        <div class="mini-kpis"><div><span data-i18n="result.net"></span><strong id="net"></strong></div><div><span data-i18n="result.gp"></span><strong id="gross"></strong></div></div>
        <p id="scenario-warning" class="result-note"></p><button id="download" type="button" data-i18n="download"></button>
      </aside>
    </div>
    <section class="card advanced"><details><summary data-i18n="advanced"></summary><p class="note" data-i18n="advanced.note"></p><div id="advanced-inputs" class="advanced-grid"></div><p class="note" data-i18n="adjustment.note"></p></details></section>
  </form>
  <div id="results">
    <div class="grid2 result-details">
      <section class="card"><h2 data-i18n="bridge.title"></h2><p class="note" data-i18n="bridge.note"></p><div class="tablebox"><table class="table"><caption class="sr-only" data-i18n="bridge.title"></caption><thead><tr><th data-i18n="bridge.item"></th><th data-i18n="unit.money"></th></tr></thead><tbody id="bridge"></tbody></table></div></section>
      <section class="card"><h2 data-i18n="sensitivity"></h2><p class="note" data-i18n="sensitivity.note"></p><div class="tablebox"><table class="table heatmap"><caption data-i18n="sensitivity.axes"></caption><thead id="heat-head"></thead><tbody id="heat"></tbody></table></div><p id="elasticity" class="note"></p></section>
    </div>
  </div>
  <section class="card backtest"><div class="card-head"><div><p class="eyebrow" data-i18n="backtest.kicker"></p><h2 data-i18n="backtest.title"></h2></div><button id="download-backtest" type="button" data-i18n="backtest.download"></button></div>
    <p class="note" data-i18n="backtest.note"></p>
    <div class="validation-kpis"><div><span data-i18n="backtest.mape"></span><strong id="mape"></strong></div><div><span data-i18n="backtest.max"></span><strong id="max-error"></strong></div><div><span data-i18n="backtest.gate"></span><strong id="gate"></strong></div></div>
    <div class="tablebox"><table class="table"><caption class="sr-only" data-i18n="backtest.title"></caption><thead><tr><th data-i18n="backtest.period"></th><th data-i18n="backtest.base"></th><th data-i18n="backtest.predicted"></th><th data-i18n="backtest.actual"></th><th data-i18n="backtest.error"></th></tr></thead><tbody id="backtests"></tbody></table></div>
    <p class="note" id="backtest-diagnosis"></p>
    <details><summary data-i18n="audit.title"></summary><div class="tablebox"><table class="table"><caption data-i18n="audit.caption"></caption><thead><tr><th data-i18n="backtest.period"></th><th data-i18n="audit.metal"></th><th data-i18n="audit.sales"></th><th data-i18n="price"></th><th data-i18n="cost"></th></tr></thead><tbody id="audit"></tbody></table></div></details>
  </section>
  <section class="card method"><h2 data-i18n="method.title"></h2><p class="formula" data-i18n="method.formula"></p><ol><li data-i18n="method.scope"></li><li data-i18n="method.bridge"></li><li data-i18n="method.cost"></li><li data-i18n="method.limits"></li><li data-i18n="method.validation"></li></ol></section>
  </div>
  <div id="catl-panel" role="tabpanel" aria-labelledby="company-catl" tabindex="0" hidden>
    <section class="preset-grid">
      <div class="card preset-card"><h2 data-i18n="catl.scenario"></h2><label><span data-i18n="catl.period"></span><select id="catl-period"></select></label><button id="catl-load" type="button" data-i18n="catl.load"></button></div>
      <div class="card preset-card"><h2 data-i18n="catl.marginPreset"></h2><label><span data-i18n="catl.reportYear"></span><select id="catl-margin-year"></select></label><button id="catl-apply-margin" type="button" data-i18n="catl.applyMargin"></button></div>
      <div class="card preset-card"><h2 data-i18n="catl.basis"></h2><p class="note" id="catl-basis"></p><p class="note" id="catl-sources"></p></div>
    </section>
    <form id="catl-inputs" novalidate>
      <div class="workspace"><section class="card"><h2 id="catl-input-title"></h2><div id="catl-products"></div></section>
        <aside class="result-panel"><p class="eyebrow" id="catl-result-title"></p><div class="hero-value"><output id="catl-parent" aria-live="polite"></output><span data-i18n="unit.money"></span></div>
          <p id="catl-error" role="alert" data-i18n="error" hidden></p><div class="mini-kpis" id="catl-kpis"></div><button id="catl-download" type="button" data-i18n="download"></button></aside></div>
      <section class="card advanced"><details><summary data-i18n="advanced"></summary><p class="note" data-i18n="catl.advancedNote"></p><div class="advanced-grid" id="catl-advanced"></div></details></section>
    </form>
    <div class="grid2 result-details" id="catl-results">
      <section class="card"><h2 data-i18n="bridge.title"></h2><div class="tablebox"><table class="table"><thead><tr><th data-i18n="bridge.item"></th><th data-i18n="unit.money"></th></tr></thead><tbody id="catl-bridge"></tbody></table></div></section>
      <section class="card"><h2 data-i18n="catl.sensitivity"></h2><p class="note" id="catl-sensitivity-note"></p><div class="tablebox"><table class="table heatmap"><caption data-i18n="catl.axes"></caption><thead id="catl-heat-head"></thead><tbody id="catl-heat"></tbody></table></div></section>
    </div>
    <section class="card backtest"><div class="card-head"><h2 data-i18n="backtest.title"></h2><button id="catl-csv" type="button" data-i18n="backtest.download"></button></div>
      <p class="note" data-i18n="catl.validation"></p><div id="catl-metrics" class="validation-kpis"></div>
      <div class="tablebox"><table class="table"><thead><tr><th data-i18n="backtest.period"></th><th data-i18n="backtest.base"></th><th data-i18n="backtest.predicted"></th><th data-i18n="backtest.actual"></th><th data-i18n="backtest.error"></th></tr></thead><tbody id="catl-history"></tbody></table></div>
      <details><summary data-i18n="catl.audit"></summary><div class="tablebox"><table class="table"><caption data-i18n="catl.auditNote"></caption><thead id="catl-audit-head"></thead><tbody id="catl-audit"></tbody></table></div><div class="tablebox"><table class="table"><caption data-i18n="catl.errorAmounts"></caption><thead id="catl-errors-head"></thead><tbody id="catl-errors"></tbody></table></div></details>
    </section>
    <section class="card method"><h2 data-i18n="method.title"></h2><p class="formula" data-i18n="catl.formula"></p><p class="note" data-i18n="catl.method"></p><p class="note" data-i18n="catl.financeMethod"></p><p class="note" data-i18n="catl.q4Method"></p></section>
  </div>
</main>
<script src="/static/i18n.js"></script>
<script src="/static/site.js"></script>
<script src="strings.js"></script>
<script src="model.js"></script>
<script src="presets.js"></script>
<script src="data/history.js"></script>
<script src="data/cmoc-history.js"></script>
<script src="data/cnooc-history.js"></script>
<script src="data/catl-history.js"></script>
<script src="catl-model.js"></script>
<script src="catl.js"></script>
<script src="app.js"></script>
</body>
</html>
