<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.title">全球铜市场数据跟踪</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="topbar-home" href="/" data-i18n="common.home"></a>
    <span class="topbar-sep">/</span><span class="topbar-title" data-i18n="page.title"></span>
    <span class="topbar-right" data-i18n="local"></span>
  </div>
  <nav class="secnav" data-i18n-aria-label="nav.label"><div class="secnav-in" id="secnav"></div></nav>
</header>
<main class="page">
  <div class="intro">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 class="page-title" data-i18n="page.title"></h1>
    <p class="lede" data-i18n="intro"></p>
    <p id="message" class="notice" role="status" data-i18n="common.loading"></p>
  </div>
  <section class="kpis" id="snapshot" aria-live="polite"></section>
  <section class="card" id="prices" data-nav="prices.title">
    <div class="card-head"><h2 data-i18n="prices.title"></h2><span class="unit" id="price-unit-label"></span></div>
    <div class="toolbar">
      <div id="prices-range"></div>
      <label><span data-i18n="priceUnit"></span><select id="price-unit"><option value="usd_t" data-i18n="usdT"></option><option value="usd_lb" data-i18n="usdLb"></option><option value="cny_t" data-i18n="cnyT"></option></select></label>
      <label><span data-i18n="basis"></span><select id="basis"><option value="net" data-i18n="net"></option><option value="gross" data-i18n="gross"></option></select></label>
    </div>
    <p class="note" data-i18n="prices.note"></p>
    <div class="legend" id="prices-legend"></div><div class="chart" id="prices-chart"></div>
  </section>
  <section class="card" id="premiums" data-nav="premiums.title">
    <div class="card-head"><h2 data-i18n="premiums.title"></h2><span class="unit" id="premium-unit"></span></div>
    <div class="toolbar"><div id="premiums-range"></div>
      <label><span data-i18n="metric"></span><select id="metric"><option value="pct" data-i18n="percent"></option><option value="spread" data-i18n="spread"></option></select></label>
    </div>
    <p class="note" id="premium-note"></p>
    <div class="legend" id="premiums-legend"></div><div class="chart" id="premiums-chart"></div>
    <div id="pair-latest" class="pair-latest"></div>
  </section>
  <section class="card" id="stocks" data-nav="stocks.title">
    <div class="card-head"><h2 data-i18n="stocks.title"></h2><span class="unit" data-i18n="tenThousandT"></span></div>
    <div id="stocks-range"></div><p class="note" data-i18n="stocks.note"></p>
    <div class="legend" id="stocks-legend"></div><div class="chart" id="stocks-chart"></div>
  </section>
  <section class="card" id="annual" data-nav="annual.title">
    <div class="card-head"><h2 data-i18n="annual.title"></h2><span class="unit" data-i18n="tenThousandT"></span></div>
    <p class="note" data-i18n="annual.note"></p>
    <div class="toolbar">
      <div><div id="annual-range"></div><div id="annual-forecast-range" hidden></div></div>
      <label><input type="checkbox" id="annual-forecast" disabled aria-controls="annual-chart annual-forecast-detail"><span data-i18n="forecast.toggle"></span></label>
    </div>
    <p class="note" id="annual-forecast-status" aria-live="polite"></p>
    <div id="annual-forecast-detail" hidden>
      <p class="note" data-i18n="forecast.note"></p>
      <div id="annual-forecast-milestones" class="forecast-milestones" aria-live="polite"></div>
    </div>
    <div class="legend" id="annual-legend"></div>
    <div class="chart" id="annual-chart"></div><p class="note" id="annual-latest" aria-live="polite"></p>
  </section>
  <section class="card" id="balance" data-nav="balance.title">
    <div class="card-head"><h2 data-i18n="balance.title"></h2><span class="unit" data-i18n="tenThousandT"></span></div>
    <p class="note" data-i18n="balance.note"></p>
    <div id="balance-range"></div><div class="chart" id="balance-chart"></div>
  </section>
  <section class="card" id="mines" data-nav="mines.title">
    <div class="card-head"><h2 data-i18n="mines.title"></h2><span id="mine-count" class="unit" aria-live="polite"></span></div>
    <p class="note" data-i18n="mines.note"></p>
    <div class="mine-filters">
      <label><span data-i18n="mines.search"></span><input type="search" id="mine-search" autocomplete="off"></label>
      <label><span data-i18n="mines.country"></span><select id="mine-country"></select></label>
      <label><span data-i18n="mines.status"></span><select id="mine-status"></select></label>
    </div>
    <div class="map-tools"><button type="button" id="map-in" data-i18n-aria-label="map.in">+</button><button type="button" id="map-out" data-i18n-aria-label="map.out">−</button><button type="button" id="map-reset" data-i18n="map.reset"></button><label><input type="checkbox" id="map-labels"><span data-i18n="map.labels"></span></label></div>
    <div class="mine-layout"><div id="mine-map"></div><aside id="mine-detail" aria-live="polite"></aside></div>
    <div class="legend" id="mine-legend"></div>
    <div id="mine-size-legend" class="mine-size-legend"></div>
    <p class="note" data-i18n="mines.sizeNote"></p>
    <div class="mine-table-wrap"><table class="mine-table"><thead><tr><th data-i18n="mines.name"></th><th data-i18n="mines.country"></th><th data-i18n="mines.status"></th><th data-i18n="mines.company"></th><th data-i18n="mines.production"></th></tr></thead><tbody id="mine-rows"></tbody></table></div>
    <div class="mine-pager"><button type="button" id="mine-prev" data-i18n="mines.prev"></button><span id="mine-page" aria-live="polite"></span><button type="button" id="mine-next" data-i18n="mines.next"></button></div>
  </section>
  <section class="card" id="about" data-nav="about.title">
    <h2 data-i18n="about.title"></h2>
    <ol class="method"><li data-i18n="about.prices"></li><li data-i18n="about.fx"></li><li data-i18n="about.formula"></li><li data-i18n="about.inventory"></li><li data-i18n="about.limits"></li></ol>
    <p class="note"><a href="https://www.cmegroup.com/markets/metals/base/copper.contractSpecs.html" target="_blank" rel="noopener">COMEX</a> · <a href="https://www.lme.com/en/Metals/Non-ferrous/LME-Copper/Contract-specifications" target="_blank" rel="noopener">LME</a> · <a href="https://www.shfe.com.cn/" target="_blank" rel="noopener">SHFE</a> · <a href="https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html" target="_blank" rel="noopener">ECB</a></p>
  </section>
</main>
<script src="/static/vendor/d3.v7.9.0.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/site.js"></script>
<script src="/static/kit.js"></script>
<script src="strings.js"></script>
<script src="fundamentals-strings.js"></script>
<script src="app.js"></script>
<script src="fundamentals.js"></script>
</body>
</html>
