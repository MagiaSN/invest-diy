<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="common.home">投研工具箱</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: var(--gap); }
  .tool { display: flex; flex-direction: column; gap: 8px; color: inherit; transition: border-color .15s; }
  .tool:hover { text-decoration: none; border-color: var(--accent); }
  .tool-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tool-kind { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--grid); color: var(--fg-muted); white-space: nowrap; }
  .tool-title { font-size: 17px; font-weight: 600; }
  .tool-desc { color: var(--fg-muted); font-size: 13px; line-height: 1.6; flex: 1; }
  .tool-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; font-size: 12px; color: var(--fg-muted); border-top: 1px solid var(--line); padding-top: 8px; }
  .tool-meta > span { white-space: nowrap; }
  .tool-meta > .tool-url { color: var(--accent); white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  .external-links { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px; }
  .external-links li { min-width: 0; }
  .external-links a { display: flex; align-items: center; height: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); overflow-wrap: anywhere; }
  .external-links a:hover { border-color: var(--accent); background: var(--grid); text-decoration: none; }
  @media (max-width: 600px) {
    .topbar-right { white-space: normal; min-width: 0; text-align: right; }
    .lang-toggle { flex: none; }
  }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="topbar-home" href="/" data-i18n="common.home">投研工具箱</a>
  <span class="topbar-right" data-i18n="home.server">本地服务 · investdiy/server.py</span>
</div></header>

<main class="page">
  <h1 class="page-title" data-i18n="common.home">投研工具箱</h1>
  <p class="lede" data-i18n="home.lede">本地看板与小工具，每个工具都有固定访问地址。</p>
  <section class="tools" id="tools"></section>
  <section class="card" aria-labelledby="external-links-title">
    <h2 id="external-links-title" data-i18n="home.externalLinks">常用外部链接</h2>
    <ul class="external-links">
      <li><a href="https://www.bls.gov/charts/employment-situation/civilian-unemployment-rate.htm" target="_blank" rel="noopener noreferrer" data-i18n="home.unemployment" data-i18n-title="home.opensNewTab">美国失业率数据（BLS）</a></li>
      <li><a href="https://fred.stlouisfed.org/series/PAYEMS" target="_blank" rel="noopener noreferrer" data-i18n="home.nonfarmPayrolls" data-i18n-title="home.opensNewTab">美国非农就业数据</a></li>
      <li><a href="https://fred.stlouisfed.org/series/PCEPILFE" target="_blank" rel="noopener noreferrer" data-i18n="home.pce" data-i18n-title="home.opensNewTab">美国 PCE 数据</a></li>
      <li><a href="https://www.bls.gov/charts/consumer-price-index/consumer-price-index-by-category-line-chart.htm" target="_blank" rel="noopener noreferrer" data-i18n="home.cpi" data-i18n-title="home.opensNewTab">美国 CPI 数据</a></li>
      <li><a href="https://fred.stlouisfed.org/series/FEDFUNDS" target="_blank" rel="noopener noreferrer" data-i18n="home.federalFundsRate" data-i18n-title="home.opensNewTab">美国联邦基金利率</a></li>
      <li><a href="https://semianalysis.com/gpu-pricing-index/" target="_blank" rel="noopener noreferrer" data-i18n="home.gpuPricing" data-i18n-title="home.opensNewTab">SemiAnalysis GPU 价格指数</a></li>
      <li><a href="https://nwfella.github.io/memory-price-index/" target="_blank" rel="noopener noreferrer" data-i18n="home.memoryPricing" data-i18n-title="home.opensNewTab">MEMWATCH 存储价格指数</a></li>
    </ul>
  </section>
</main>

<script src="/static/i18n.js"></script>
<script src="/static/site.js"></script>
<script>
i18n.add({
  zh: {
    'home.server': '本地服务 · investdiy/server.py',
    'home.snapshot': '静态快照 · 由本地更新后发布',
    'home.lede': '本地看板与小工具，每个工具都有固定访问地址。',
    'home.empty': '还没有工具。',
    'home.nodata': '尚无数据',
    'home.error': '工具清单加载失败，确认服务器在运行。',
    'home.local': '本地工具',
    'home.public': '公开工具',
    'home.externalLinks': '常用外部链接',
    'home.unemployment': '美国失业率数据（BLS）',
    'home.nonfarmPayrolls': '美国非农就业数据',
    'home.pce': '美国 PCE 数据',
    'home.cpi': '美国 CPI 数据',
    'home.federalFundsRate': '美国联邦基金利率',
    'home.gpuPricing': 'SemiAnalysis GPU 价格指数',
    'home.memoryPricing': 'MEMWATCH 存储价格指数',
    'home.opensNewTab': '在新标签页中打开',
  },
  en: {
    'home.server': 'Local server · investdiy/server.py',
    'home.snapshot': 'Static snapshot · published from local updates',
    'home.lede': 'Local dashboards and small tools, each with a fixed address.',
    'home.empty': 'No tools yet.',
    'home.nodata': 'No data yet',
    'home.error': 'Could not load the tool list. Check that the server is running.',
    'home.local': 'Local only',
    'home.public': 'Public',
    'home.externalLinks': 'Useful external links',
    'home.unemployment': 'U.S. unemployment rate data (BLS)',
    'home.nonfarmPayrolls': 'U.S. nonfarm payroll data',
    'home.pce': 'U.S. PCE data',
    'home.cpi': 'U.S. CPI data',
    'home.federalFundsRate': 'U.S. federal funds rate',
    'home.gpuPricing': 'SemiAnalysis GPU Pricing Index',
    'home.memoryPricing': 'MEMWATCH Memory Price Index',
    'home.opensNewTab': 'Open in a new tab',
  },
});

let tools = null;
const box = document.getElementById('tools');

function render() {
  if (!tools) return;
  if (!tools.length) { box.textContent = i18n.t('home.empty'); return; }
  box.replaceChildren(...tools.map((t) => {
    const m = t[i18n.lang] || t.zh;
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const a = el('a', 'card tool'); a.href = t.url;
    const top = el('div', 'tool-top');
    top.append(el('span', 'tool-title', m.title), el('span', 'tool-kind', m.kind),
      el('span', 'tool-kind tool-visibility', i18n.t(t.visibility === 'public' ? 'home.public' : 'home.local')));
    const meta = el('div', 'tool-meta');
    meta.append(el('span', null, t.asof ? i18n.t('common.asof', { d: t.asof }) : i18n.t('home.nodata')),
      el('span', 'tool-url', t.url));
    meta.lastChild.title = location.host + t.url;
    a.append(top, el('div', 'tool-desc', m.description), meta);
    return a;
  }));
}

i18n.onChange(render);
fetch('/api/tools.json').then((r) => r.json()).then((list) => {
  tools = list.sort((a, b) => Number(b.slug === 'pe-calculator') - Number(a.slug === 'pe-calculator'));
  render();
})
  .catch(() => { box.textContent = i18n.t('home.error'); });
</script>
</body>
</html>
