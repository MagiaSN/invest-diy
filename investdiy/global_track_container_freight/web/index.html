<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.title">全球航运指数数据跟踪</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  .take { display: flex; flex-direction: column; gap: 4px; }
  .charts-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .charts-head h2 { margin: 0 0 5px; font-size: 20px; }
  .charts-head .note { margin: 0; }
  .chart-list { display: grid; gap: 20px; }
  .chart-action { font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .chart-add { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  .chart-remove { color: var(--fg-muted); background: transparent; }
  .chart-action:disabled { opacity: .45; cursor: not-allowed; }
  .chart-action:focus-visible, .chart-controls select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .freight-chart { min-width: 0; }
  .chart-heading { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .chart-number { border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; color: var(--fg-muted); font-size: 12px; }
  .chart-heading h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
  .chart-controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; margin: 16px 0; }
  .chart-controls label { min-width: 0; display: grid; gap: 7px; font-size: 12px; color: var(--fg-muted); }
  .chart-controls select { width: 100%; min-width: 0; font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); color: var(--fg); }
  .chart-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line); }
  .chart-caption { color: var(--fg-muted); font-size: 12px; }
  .chart-state:empty { display: none; }
  .chart-plot { min-height: 300px; }
  .chart-plot:has(> .chart-empty) { display: grid; place-items: center; }
  .chart-empty { text-align: center; color: var(--fg-muted); font-size: 13px; padding: 32px; }
  .chart-details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 12px; color: var(--fg-muted); }
  .chart-details summary { cursor: pointer; width: fit-content; }
  .chart-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }
  .chart-facts div { min-width: 0; }
  .chart-facts dt { margin-bottom: 5px; }
  .chart-facts dd { margin: 0; color: var(--fg); overflow-wrap: anywhere; }
  .chart-source { white-space: pre-line; overflow-wrap: anywhere; }
  @media (max-width: 600px) {
    .topbar-title { display: none; }
    .topbar-right { white-space: normal; min-width: 0; text-align: right; }
    .lang-toggle { flex: none; }
    .chart-controls { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .chart-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .charts-head { align-items: flex-start; }
  }
  .about { margin: 0; padding-left: 18px; font-size: 13px; color: var(--fg-muted); line-height: 1.85; max-width: 92ch; display: flex; flex-direction: column; gap: 6px; }
  .about b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<!-- every static text has a data-i18n key (see strings.js); the Chinese inside tags is only a placeholder until scripts load -->
<header class="topbar">
  <div class="topbar-in">
    <a class="topbar-home" href="/" data-i18n="common.home">投研工具箱</a>
    <span class="topbar-sep">/</span>
    <span class="topbar-title" data-i18n="page.title">全球航运指数数据跟踪</span>
    <span class="topbar-right" id="asof"></span>
  </div>
  <nav class="secnav" data-i18n-aria-label="nav.label"><div class="secnav-in" id="secnav"></div></nav>
</header>

<main class="page">
  <div class="take">
    <h1 class="page-title" data-i18n="page.title">全球航运指数数据跟踪</h1>
    <p class="stale" id="stale" hidden></p>
    <p class="lede" id="take-now">加载中…</p>
  </div>

  <section class="kpis">
    <div class="kpi"><span class="kpi-label" data-i18n="k.ccfi">CCFI 综合指数</span><span class="kpi-value" id="k-ccfi">—</span><span class="kpi-sub" id="k-ccfi-sub">—</span></div>
    <div class="kpi"><span class="kpi-label" data-i18n="k.scfi">SCFI 综合指数</span><span class="kpi-value" id="k-scfi">—</span><span class="kpi-sub" id="k-scfi-sub">—</span></div>
    <div class="kpi"><span class="kpi-label" data-i18n="k.scfisEu">SCFIS 欧洲航线</span><span class="kpi-value" id="k-scfis-eu">—</span><span class="kpi-sub" id="k-scfis-eu-sub">—</span></div>
    <div class="kpi"><span class="kpi-label" data-i18n="k.scfisUs">SCFIS 美西航线</span><span class="kpi-value" id="k-scfis-us">—</span><span class="kpi-sub" id="k-scfis-us-sub">—</span></div>
  </section>

  <section id="charts" data-nav="nav.charts">
    <div class="charts-head">
      <div><h2 data-i18n="charts.title">指数走势</h2><p class="note" data-i18n="charts.note"></p></div>
      <button type="button" class="chart-action chart-add" id="add-chart" data-i18n="charts.add" disabled>＋ 添加图表</button>
    </div>
    <div id="chart-list" class="chart-list"></div>
    <p id="chart-message" class="note" role="status" data-i18n="common.loading"></p>
    <p class="dl" data-files="latest history"></p>
  </section>

  <section class="card" id="about" data-nav="nav.about">
    <h2 data-i18n="a.h2">关于本页</h2>
    <ol class="about">
      <li data-i18n-html="a.what"></li>
      <li data-i18n-html="a.src"></li>
      <li data-i18n-html="a.calc"></li>
      <li data-i18n-html="a.limits"></li>
    </ol>
  </section>
</main>

<template id="freight-chart-template">
  <article class="card freight-chart">
    <div class="card-head">
      <div class="chart-heading"><span class="chart-number"></span><h3 class="chart-title"></h3></div>
      <button type="button" class="chart-action chart-remove"></button>
    </div>
    <div class="chart-controls">
      <label><span class="chart-index-label"></span><select class="chart-index"></select></label>
      <label><span class="chart-series-label"></span><select class="chart-series"></select></label>
    </div>
    <div class="chart-toolbar"><div class="chart-range"></div><span class="chart-caption"></span></div>
    <p class="chart-state note" role="status"></p>
    <div class="chart chart-plot"></div>
    <details class="chart-details">
      <summary></summary>
      <dl class="chart-facts"></dl>
      <a class="chart-source-link" target="_blank" rel="noopener"></a>
      <p class="chart-source"></p>
    </details>
  </article>
</template>

<script src="/static/vendor/d3.v7.9.0.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/site.js"></script>
<script src="/static/kit.js"></script>
<script src="strings.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
