# Scheduled collection requires the repository opt-in and encryption secret.
# This local tool must never enter the public export or Surge deployment workflow.
name: Collect shipping indices (SSE + PDCI)

on:
  workflow_dispatch:
    inputs:
      import_local_pdci_history:
        description: "One-time import of the encrypted local history including PDCI"
        type: boolean
        default: false
      initialize:
        description: "Allow starting without a saved history (first run only)"
        type: boolean
        default: false
  schedule:
    # UTC; Beijing 09:37/13:37 catch delayed public components from the prior release.
    # 15:37/17:37/20:37 follow afternoon releases. Run daily, including weekends.
    # Include weekly PDCI (normally released Friday); later runs retry delayed data.
    # PDCI uses Panasia first and Xinhua on failure, sharing this encrypted history.
    - cron: "37 1,5,7,9,12 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: sse-collection
  cancel-in-progress: false

jobs:
  collect:
    if: vars.SSE_COLLECTION_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: investdiy/global_track_container_freight/data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Record actual collection timing
        env:
          COLLECTION_EVENT: ${{ github.event_name }}
          COLLECTION_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          lines = ["## Shipping collection timing (SSE + PDCI)", "",
                   f"Trigger: {os.environ['COLLECTION_EVENT']}",
                   f"Cron (UTC): {os.environ['COLLECTION_CRON'] or 'manual'}",
                   f"Started (UTC): {now.isoformat(timespec='seconds')}",
                   f"Started (Beijing): {now.astimezone(ZoneInfo('Asia/Shanghai')).isoformat(timespec='seconds')}", ""]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("\n\n".join(lines) + "\n")
          PY

      - name: Check encryption configuration
        env:
          SSE_DATA_PASSPHRASE: ${{ secrets.SSE_DATA_PASSPHRASE }}
        run: |
          if [ -z "$SSE_DATA_PASSPHRASE" ]; then
            echo "::error::Configure SSE_DATA_PASSPHRASE before collecting local data."
            exit 1
          fi
          command -v gpg

      - name: Restore latest encrypted history from this workflow and branch
        id: restore
        uses: actions/github-script@v7
        env:
          INITIALIZE: ${{ inputs.initialize || false }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = context.repo;
            const current = await github.rest.actions.getWorkflowRun({...repo, run_id: context.runId});
            let saved;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...repo, name: 'sse-history-encrypted', per_page: 100
            });
            artifacts.sort((a, b) => b.created_at.localeCompare(a.created_at));
            for (const artifact of artifacts) {
              if (artifact.expired || artifact.workflow_run?.head_branch !== current.data.head_branch) continue;
              const run = await github.rest.actions.getWorkflowRun({...repo, run_id: artifact.workflow_run.id});
              if (run.data.workflow_id !== current.data.workflow_id) continue;
              saved = artifact;
              break;
            }
            if (!saved) {
              if (process.env.INITIALIZE !== 'true') {
                throw new Error('No history found. Use initialize only for a deliberate fresh start; recover expired history from a backup.');
              }
              core.notice('Starting a new history from the periods currently exposed by SSE.');
              core.setOutput('found', 'false');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              ...repo, artifact_id: saved.id, archive_format: 'zip'
            });
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'sse-history.zip'), Buffer.from(download.data));
            core.setOutput('found', 'true');

      - name: Decrypt saved history
        if: steps.restore.outputs.found == 'true'
        env:
          SSE_DATA_PASSPHRASE: ${{ secrets.SSE_DATA_PASSPHRASE }}
        run: |
          umask 077
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          tmp = Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(tmp / "sse-history.zip") as archive:
              (tmp / "sse-history.gpg").write_bytes(archive.read("sse-history.tar.gz.gpg"))
          PY
          printf '%s' "$SSE_DATA_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --output "$RUNNER_TEMP/sse-history.tar.gz" --decrypt "$RUNNER_TEMP/sse-history.gpg"
          mkdir -p "$DATA_DIR"
          tar xzf "$RUNNER_TEMP/sse-history.tar.gz" --directory "$DATA_DIR"

      - name: Import encrypted local PDCI history once
        if: github.event_name == 'workflow_dispatch' && inputs.import_local_pdci_history
        env:
          SSE_LOCAL_PDCI_SEED_1: ${{ secrets.SSE_LOCAL_PDCI_SEED_1 }}
          SSE_LOCAL_PDCI_SEED_2: ${{ secrets.SSE_LOCAL_PDCI_SEED_2 }}
          SSE_DATA_PASSPHRASE: ${{ secrets.SSE_DATA_PASSPHRASE }}
        run: |
          python - <<'PYSEED'
          import base64, hashlib, os, tempfile
          from pathlib import Path
          from investdiy.common import github_actions
          from investdiy.global_track_container_freight import sync

          with tempfile.TemporaryDirectory(prefix="shipping-local-seed-") as temporary:
              folder = Path(temporary)
              payload = base64.b64decode(os.environ["SSE_LOCAL_PDCI_SEED_1"] + os.environ["SSE_LOCAL_PDCI_SEED_2"], validate=True)
              if hashlib.sha256(payload).hexdigest() != "2b64e89acdab04965516b4d45980ac134be8f67b2dc2e526e9a4555435ac0148":
                  raise ValueError("Unexpected encrypted local seed digest")
              encrypted = folder / "seed.gpg"
              encrypted.write_bytes(payload)
              key = folder / "key"
              key.touch(mode=0o600)
              key.write_text(os.environ["SSE_DATA_PASSPHRASE"])
              rows = sync.decode_snapshot(github_actions.decrypt_members(encrypted, key, list(sync.SCHEMAS)))
              if len(rows["observations.csv"]) != 2364 or sum(r["index"] == "pdci" for r in rows["observations.csv"]) != 596:
                  raise ValueError("Incomplete local history including PDCI")
              result = sync.install_snapshot(rows, Path(os.environ["DATA_DIR"]), folder / "backup")
              print(f"Local history imported: {result['added']} added, {result['corrected']} corrected, {result['total']} total observations.")
          PYSEED

      - name: Fetch SSE and PDCI and check every source
        id: collect
        continue-on-error: true
        env:
          SSE_COOKIE: ${{ secrets.SSE_COOKIE }}
        run: python -m investdiy.global_track_container_freight.collect

      # Preserve successful source updates even when a different source failed.
      # Neither plaintext data nor plaintext logs are uploaded or cached.
      - name: Encrypt accumulated history
        id: encrypt
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' && steps.collect.outcome != '' }}
        env:
          SSE_DATA_PASSPHRASE: ${{ secrets.SSE_DATA_PASSPHRASE }}
        run: |
          umask 077
          test -s "$DATA_DIR/observations.csv"
          tar czf "$RUNNER_TEMP/sse-history.tar.gz" --directory "$DATA_DIR" .
          printf '%s' "$SSE_DATA_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/sse-history.tar.gz.gpg" "$RUNNER_TEMP/sse-history.tar.gz"

      - name: Save encrypted history
        if: ${{ !cancelled() && steps.encrypt.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sse-history-encrypted
          path: ${{ runner.temp }}/sse-history.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Report collection failure
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' }}
        run: |
          echo "::error::One or more shipping sources (SSE/PDCI) failed validation. Available updates were preserved in the encrypted snapshot."
          exit 1

      - name: Remove runner copies
        if: always()
        run: |
          rm -rf -- "$DATA_DIR"
          rm -f -- "$RUNNER_TEMP"/sse-history.zip "$RUNNER_TEMP"/sse-history.gpg \
            "$RUNNER_TEMP"/sse-history.tar.gz "$RUNNER_TEMP"/sse-history.tar.gz.gpg
